name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app (universal)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0-dev"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Make DMG
        run: VERSION="$VERSION" ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: UzPort-${{ env.VERSION }}
          path: build/UzPort-*.dmg*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" build/UzPort-*.dmg build/UzPort-*.dmg.sha256 --clobber \
            || gh release create "$GITHUB_REF_NAME" build/UzPort-*.dmg build/UzPort-*.dmg.sha256 \
                 --title "UzPort $VERSION" --generate-notes
